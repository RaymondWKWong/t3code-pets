name: T3 compatibility

on:
  pull_request:
  workflow_dispatch:

jobs:
  pinned-checkout:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: T3 nightly 20260810.1059
            commit: 78f462c4e18c8ea5e5037dc916389a3b72246025
          - name: T3 nightly 20260812.1072
            commit: 560d4a4560ddb5f42c8f8e0e35fa7827c0e46f80
          - name: T3 main f0719072
            commit: f0719072a1c6435b5a91243afc57bc8bf1f3e2b6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - run: corepack enable
      - run: corepack pnpm@11.10.0 install --frozen-lockfile
      - run: corepack pnpm@11.10.0 build
      - run: corepack pnpm@11.10.0 tsx scripts/verify-romeo-package.ts
      - run: corepack pnpm@11.10.0 build:release
      - run: git clone https://github.com/pingdotgg/t3code.git ../t3code-fixture
      - run: git -C ../t3code-fixture checkout ${{ matrix.commit }}
      - run: npx --yes --package=./dist/t3code-pets.tgz t3code-pets install --t3 ../t3code-fixture
      - run: npx --yes --package=./dist/t3code-pets.tgz t3code-pets doctor --t3 ../t3code-fixture
      - run: npx --yes --package=./dist/t3code-pets.tgz t3code-pets uninstall --t3 ../t3code-fixture
      - run: test -z "$(git -C ../t3code-fixture status --porcelain)"
